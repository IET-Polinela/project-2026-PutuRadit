<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart City Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        body{
            background:#f3f5f9;
            font-family:'Segoe UI',sans-serif;
        }

        .navbar{
            background:linear-gradient(
                90deg,
                #1d6df2,
                #0d5be1
            ) !important;

            box-shadow:0 2px 12px rgba(0,0,0,.15);
        }

        .navbar-brand{
            font-size:1.8rem;
            font-weight:700;
        }

        .navbar-user{
            display:flex;
            align-items:center;
            gap:10px;
            color:white;
            font-weight:500;
        }

        .user-avatar{
            width:42px;
            height:42px;
            border-radius:50%;
            background:white;
            color:#1d6df2;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:1.3rem;
            font-weight:bold;
        }

        .card{
            border:none;
            border-radius:16px;
            box-shadow:0 3px 14px rgba(0,0,0,.06);
        }

        .btn-primary{
            border:none;
            border-radius:12px;
            background:#1d6df2;
        }

        .btn-primary:hover{
            background:#1457c9;
        }

        .menu-link{
            display:block;
            text-decoration:none;
            color:#334155;

            padding:12px 16px;
            border-radius:12px;

            margin-bottom:8px;

            transition:.2s;
        }

        .menu-link:hover{
            background:#eef5ff;
            color:#1d6df2;
        }

        .menu-active{
            background:#eef5ff;
            color:#1d6df2;
            font-weight:600;
        }

        .stat-card{
            border:1px solid #edf0f5;
            border-radius:14px;
            padding:14px;
            margin-bottom:12px;
        }

        .stat-icon{
            width:50px;
            height:50px;

            display:flex;
            align-items:center;
            justify-content:center;

            border-radius:12px;
            font-size:1.4rem;
        }

        .center-card{
            min-height:700px;
        }

        #welcome-icon{
            font-size:4rem;
            color:#94a3b8;
        }

        #app{
            min-height:90vh;
        }

        .announcement-item{
            border-left:4px solid #1d6df2;
            background:#f8fbff;
            padding:12px;
            border-radius:10px;
            margin-bottom:12px;
        }

        @media(max-width:991px){

            .navbar-brand{
                font-size:1.3rem;
            }

            .center-card{
                min-height:350px;
            }

        }

    </style>

</head>

<body>

    <nav class="navbar navbar-dark">

        <div class="container-fluid px-4">

            <span class="navbar-brand">

                <i class="bi bi-buildings-fill"></i>

                Smart City Portal

            </span>

            <div class="navbar-user">

                <div class="user-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>

                <span>
                    Citizen User
                </span>

            </div>

        </div>

    </nav>

    <main
        id="app"
        class="container-fluid p-4">

    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
