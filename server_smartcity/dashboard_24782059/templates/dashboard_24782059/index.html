{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<style>
    body{
        background:
            linear-gradient(rgba(5,10,25,0.68), rgba(5,10,25,0.82)),
            url('https://c.tenor.com/lPsMNpUunr4AAAAd/minecraft-aesthetic-background.gif')
            center center / cover no-repeat fixed !important;
    }

    .dashboard-wrap {
        padding-bottom: 40px;
    }

    .pixel-heading {
        font-family: 'Cinzel', serif;
        font-size: 2.4rem;
        font-weight: 900;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 4px 4px 0 #000;
        animation: pixelDrop .7s ease;
    }

    .pixel-card {
        background: rgba(18,18,18,0.90) !important;
        border: 5px solid #111 !important;
        border-radius: 0 !important;
        box-shadow: 10px 10px 0 #000 !important;
        padding: 22px;
        min-height: 430px;
        animation: pixelUp .8s ease;
        transition: .2s ease;
    }

    .pixel-card:hover {
        transform: translateY(-6px);
        box-shadow: 14px 14px 0 #000, 0 0 22px rgba(120,255,92,0.25) !important;
    }

    .pixel-card h5,
    .pixel-section-title {
        font-family: 'Cinzel', serif;
        font-weight: 900;
        text-transform: uppercase;
        color: white;
        text-shadow: 3px 3px 0 #000;
        margin-bottom: 18px;
    }

    .chart-box {
        height: 330px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            linear-gradient(90deg, rgba(120,255,92,0.06) 1px, transparent 1px),
            linear-gradient(rgba(120,255,92,0.06) 1px, transparent 1px);
        background-size: 24px 24px;
        border: 4px solid #111;
        padding: 14px;
        box-shadow: inset 0 0 0 3px rgba(255,255,255,0.04);
    }

    .chart-box canvas {
        max-height: 310px;
    }

    .pixel-list {
        background: rgba(18,18,18,0.90);
        border: 5px solid #111;
        box-shadow: 10px 10px 0 #000;
        padding: 10px;
        min-height: 240px;
        animation: pixelUp 1s ease;
    }

    .pixel-list .list-group-item {
        background: #252525;
        color: white;
        border: 3px solid #111;
        margin-bottom: 10px;
        border-radius: 0;
        font-weight: 800;
        transition: .2s ease;
    }

    .pixel-list .list-group-item:hover {
        background: #2e8b24;
        transform: translateX(6px);
    }

    .pixel-list small {
        color: #d6d6d6;
        font-size: .8rem;
    }

    .pixel-divider {
        border: none;
        height: 5px;
        background: #111;
        box-shadow: 0 4px 0 rgba(0,0,0,0.7);
        margin: 35px 0;
        opacity: 1;
    }

    @keyframes pixelUp {
        from { opacity: 0; transform: translateY(35px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pixelDrop {
        from { opacity: 0; transform: translateY(-25px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="dashboard-wrap">

    <h3 class="pixel-heading mb-4">
        Dashboard Laporan
    </h3>

    <div class="row g-4">

        <div class="col-lg-6">
            <div class="pixel-card">
                <h5>Distribusi Status</h5>
                <div class="chart-box">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="pixel-card">
                <h5>Distribusi Kategori</h5>
                <div class="chart-box">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

    </div>

    <hr class="pixel-divider">

    <div class="row g-4 mt-2">

        <div class="col-lg-6">
            <h5 class="pixel-section-title">5 Laporan Terbaru</h5>
            <ul id="reportedList" class="list-group pixel-list"></ul>
        </div>

        <div class="col-lg-6">
            <h5 class="pixel-section-title">5 Laporan Selesai</h5>
            <ul id="resolvedList" class="list-group pixel-list"></ul>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
Chart.defaults.color = "#ffffff";
Chart.defaults.borderColor = "rgba(120,255,92,0.18)";
Chart.defaults.font.family = "Poppins";
Chart.defaults.font.weight = "800";

const pixelColors = [
    "#78ff5c",
    "#39a9ff",
    "#ffd23f",
    "#ff5c5c",
    "#b967ff"
];

const pixelLegend = {
    labels: {
        color: "#ffffff",
        boxWidth: 18,
        padding: 14,
        font: {
            size: 11,
            weight: "800"
        }
    }
};

// STATUS CHART
fetch("/reports/api/status/")
.then(res => {
    if (!res.ok) throw new Error("Status API error");
    return res.json();
})
.then(data => {
    const ctx = document.getElementById("statusChart");

    new Chart(ctx, {
        type: "doughnut",
        data: {
            labels: Object.keys(data),
            datasets: [{
                data: Object.values(data),
                backgroundColor: pixelColors,
                borderColor: "#111111",
                borderWidth: 5,
                hoverOffset: 14
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: "48%",
            animation: {
                animateRotate: true,
                animateScale: true,
                duration: 900
            },
            plugins: {
                legend: {
                    position: "top",
                    labels: pixelLegend.labels
                }
            }
        }
    });
})
.catch(err => console.error("ERROR STATUS:", err));


// CATEGORY CHART
fetch("/reports/api/category/")
.then(res => {
    if (!res.ok) throw new Error("Category API error");
    return res.json();
})
.then(data => {
    const ctx = document.getElementById("categoryChart");

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: Object.keys(data),
            datasets: [{
                label: "Jumlah Laporan",
                data: Object.values(data),
                backgroundColor: "#39a9ff",
                borderColor: "#111111",
                borderWidth: 4,
                hoverBackgroundColor: "#78ff5c"
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
                duration: 900,
                easing: "easeOutBounce"
            },
            plugins: {
                legend: {
                    position: "top",
                    labels: pixelLegend.labels
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        color: "#ffffff",
                        font: {
                            size: 11,
                            weight: "800"
                        }
                    },
                    grid: {
                        color: "rgba(120,255,92,0.16)"
                    }
                },
                x: {
                    ticks: {
                        color: "#ffffff",
                        font: {
                            size: 11,
                            weight: "800"
                        },
                        maxRotation: 25,
                        minRotation: 25
                    },
                    grid: {
                        color: "rgba(255,255,255,0.08)"
                    }
                }
            }
        }
    });
})
.catch(err => console.error("ERROR CATEGORY:", err));


// RECENT REPORTS
fetch("/reports/api/recent/")
.then(res => {
    if (!res.ok) throw new Error("Recent API error");
    return res.json();
})
.then(data => {
    const reportedList = document.getElementById("reportedList");
    const resolvedList = document.getElementById("resolvedList");

    reportedList.innerHTML = "";
    resolvedList.innerHTML = "";

    if (data.reported.length === 0) {
        reportedList.innerHTML = `
            <li class="list-group-item">
                Belum ada laporan terbaru
            </li>
        `;
    }

    if (data.resolved.length === 0) {
        resolvedList.innerHTML = `
            <li class="list-group-item">
                Belum ada laporan selesai
            </li>
        `;
    }

    data.reported.forEach(item => {
        reportedList.innerHTML += `
            <li class="list-group-item">
                ${item.title}
                <br>
                <small>${item.created_at}</small>
            </li>
        `;
    });

    data.resolved.forEach(item => {
        resolvedList.innerHTML += `
            <li class="list-group-item">
                ${item.title}
                <br>
                <small>${item.created_at}</small>
            </li>
        `;
    });
})
.catch(err => console.error("ERROR RECENT:", err));
</script>

{% endblock %}
