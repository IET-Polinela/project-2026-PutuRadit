{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<h3 class="mb-4">Dashboard Laporan</h3>

<div class="row">

    <!-- DOUGHNUT -->
    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <h5>Distribusi Status</h5>
            <canvas id="statusChart"></canvas>
        </div>
    </div>

    <!-- BAR -->
    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <h5>Distribusi Kategori</h5>
            <canvas id="categoryChart"></canvas>
        </div>
    </div>

</div>

<hr>

<div class="row mt-4">

    <!-- REPORTED -->
    <div class="col-md-6">
        <h5>5 Laporan Terbaru (REPORTED)</h5>
        <ul id="reportedList" class="list-group"></ul>
    </div>

    <!-- RESOLVED -->
    <div class="col-md-6">
        <h5>5 Laporan Selesai (RESOLVED)</h5>
        <ul id="resolvedList" class="list-group"></ul>
    </div>

</div>

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

// =========================
// STATUS CHART
// =========================
fetch("/reports/api/status/")
.then(res => {
    if (!res.ok) throw new Error("Status API error");
    return res.json();
})
.then(data => {

    console.log("STATUS DATA:", data);

    const ctx = document.getElementById("statusChart");

    new Chart(ctx, {
        type: "doughnut",
        data: {
            labels: Object.keys(data),
            datasets: [{
                data: Object.values(data),
                backgroundColor: [
                    "#6c757d",
                    "#0dcaf0",
                    "#ffc107",
                    "#198754"
                ]
            }]
        }
    });
})
.catch(err => console.error("ERROR STATUS:", err));


// =========================
// CATEGORY CHART
// =========================
fetch("/reports/api/category/")
.then(res => {
    if (!res.ok) throw new Error("Category API error");
    return res.json();
})
.then(data => {

    console.log("CATEGORY DATA:", data);

    const ctx = document.getElementById("categoryChart");

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: Object.keys(data),
            datasets: [{
                label: "Jumlah Laporan",
                data: Object.values(data),
            }]
        }
    });
})
.catch(err => console.error("ERROR CATEGORY:", err));


// =========================
// RECENT REPORTS
// =========================
fetch("/reports/api/recent/")
.then(res => {
    if (!res.ok) throw new Error("Recent API error");
    return res.json();
})
.then(data => {

    console.log("RECENT DATA:", data);

    const reportedList = document.getElementById("reportedList");
    const resolvedList = document.getElementById("resolvedList");

    data.reported.forEach(item => {
        reportedList.innerHTML += `
            <li class="list-group-item">
                ${item.title}
                <br>
                <small>${item.created_at}</small>
            </li>
        `;
    });

    data.resolved.forEach(item => {
        resolvedList.innerHTML += `
            <li class="list-group-item">
                ${item.title}
                <br>
                <small>${item.created_at}</small>
            </li>
        `;
    });

})
.catch(err => console.error("ERROR RECENT:", err));

</script>

{% endblock %}
