{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<h3 class="mb-4">Dashboard Laporan</h3>

<div class="row">

    <!-- DOUGHNUT -->
    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <h5>Distribusi Status</h5>
            <canvas id="statusChart"></canvas>
        </div>
    </div>

    <!-- BAR -->
    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <h5>Distribusi Kategori</h5>
            <canvas id="categoryChart"></canvas>
        </div>
    </div>

</div>

<hr>

<div class="row mt-4">

    <!-- REPORTED -->
    <div class="col-md-6">
        <h5>5 Laporan Terbaru (REPORTED)</h5>
        <ul id="reportedList" class="list-group"></ul>
    </div>

    <!-- RESOLVED -->
    <div class="col-md-6">
        <h5>5 Laporan Selesai (RESOLVED)</h5>
        <ul id="resolvedList" class="list-group"></ul>
    </div>

</div>

<!-- 🔥 CHART JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// =========================
// STATUS CHART (DOUGHNUT)
// =========================
fetch("/reports/api/status/")
.then(res => res.json())
.then(data => {

    const ctx = document.getElementById("statusChart");

    new Chart(ctx, {
        type: "doughnut",
        data: {
            labels: Object.keys(data),
            datasets: [{
                data: Object.values(data),
                backgroundColor: [
                    "#6c757d", // REPORTED
                    "#0dcaf0", // VERIFIED
                    "#ffc107", // IN_PROGRESS
                    "#198754"  // RESOLVED
                ]
            }]
        }
    });
});


// =========================
// CATEGORY CHART (BAR)
// =========================
fetch("/reports/api/category/")
.then(res => res.json())
.then(data => {

    const ctx = document.getElementById("categoryChart");

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: Object.keys(data),
            datasets: [{
                label: "Jumlah Laporan",
                data: Object.values(data),
            }]
        }
    });
});


// =========================
// RECENT REPORTS
// =========================
fetch("/reports/api/recent/")
.then(res => res.json())
.then(data => {

    const reportedList = document.getElementById("reportedList");
    const resolvedList = document.getElementById("resolvedList");

    data.reported.forEach(item => {
        reportedList.innerHTML += `
            <li class="list-group-item">
                ${item.title}
                <br>
                <small>${item.created_at}</small>
            </li>
        `;
    });

    data.resolved.forEach(item => {
        resolvedList.innerHTML += `
            <li class="list-group-item">
                ${item.title}
                <br>
                <small>${item.created_at}</small>
            </li>
        `;
    });

});
</script>

{% endblock %}
