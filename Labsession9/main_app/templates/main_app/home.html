{% extends 'base.html' %}

{% block title %}Home | Nasha Town{% endblock %}

{% block content %}

<style>
    .container.mt-4{
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    .minecraft-hero {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        padding: 0 40px;
        background:
            linear-gradient(rgba(0,0,0,0.08), rgba(0,0,0,0.34)),
            linear-gradient(135deg, #ff3b3b 0%, #f65858 42%, #bd1818 100%);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .minecraft-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            linear-gradient(90deg, rgba(255,255,255,.05) 25%, transparent 25%) 0 0 / 90px 90px,
            linear-gradient(rgba(255,255,255,.035) 25%, transparent 25%) 0 0 / 90px 90px;
        opacity: .5;
        z-index: 0;
    }

    .hero-content {
        position: relative;
        z-index: 6;
        margin-bottom: 90px;
    }

    .pixel-title {
        font-family: 'Cinzel', serif;
        font-size: 5.3rem;
        font-weight: 900;
        color: white;
        text-shadow: 7px 7px 0 #111, 0 0 24px rgba(255,255,255,0.35);
        letter-spacing: 6px;
        animation: popDown .9s ease;
        margin-bottom: 25px;
    }

    .hero-subtitle {
        font-family: monospace;
        font-size: 2.2rem;
        color: white;
        text-shadow: 3px 3px 0 #111;
        margin-bottom: 20px;
        animation: fadeIn 1.2s ease;
    }

    .hero-desc {
        max-width: 900px;
        margin: 0 auto;
        color: #f5f5f5;
        font-size: 1.3rem;
        line-height: 1.8;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.45);
        animation: fadeIn 1.4s ease;
        padding: 0 20px;
    }

    .pixel-btn {
        margin-top: 38px;
        background: linear-gradient(to bottom, #49d12f, #2e9b1e);
        color: white;
        border: 4px solid #174d10;
        padding: 18px 42px;
        font-weight: bold;
        text-decoration: none;
        display: inline-block;
        box-shadow: 6px 6px 0 #111;
        transition: .2s;
        font-size: 1.2rem;
        animation: fadeIn 1.6s ease;
    }

    .pixel-btn:hover {
        transform: translateY(-4px);
        box-shadow: 9px 9px 0 #111;
        color: white;
    }

    .decor {
        position: absolute;
        z-index: 3;
        image-rendering: pixelated;
        animation: floatDecor 4s ease-in-out infinite;
    }

    /* CLOUDS */
    .cloud {
        position: absolute;
        height: 58px;
        background: white;
        box-shadow: 7px 7px 0 rgba(0,0,0,.22);
        clip-path: polygon(
            0 60%, 15% 60%, 15% 40%, 28% 40%,
            28% 22%, 45% 22%, 45% 8%, 62% 8%,
            62% 30%, 80% 30%, 80% 52%, 100% 52%,
            100% 86%, 0 86%
        );
        animation: cloudMove 9s ease-in-out infinite alternate;
        z-index: 2;
    }

    .cloud1 { top: 14%; left: 12%; width: 180px; animation-delay: 0s; }
    .cloud2 { top: 10%; left: 36%; width: 155px; animation-delay: .8s; }
    .cloud3 { top: 12%; right: 25%; width: 175px; animation-delay: 1.4s; }
    .cloud4 { top: 26%; left: 6%; width: 120px; animation-delay: .5s; }
    .cloud5 { top: 25%; right: 9%; width: 150px; animation-delay: 1.1s; }
    .cloud6 { top: 19%; right: 42%; width: 95px; animation-delay: 1.7s; }

    /* FOREST */
    .forest {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 70px;
        height: 260px;
        z-index: 3;
        pointer-events: none;
    }

    .tree {
        position: absolute;
        bottom: 0;
        width: 210px;
        height: 245px;
        image-rendering: pixelated;
    }

    .tree.small {
        transform: scale(.55);
        transform-origin: bottom center;
        opacity: .9;
    }

    .tree.medium {
        transform: scale(.75);
        transform-origin: bottom center;
        opacity: .95;
    }

    .tree.big {
        transform: scale(1);
        transform-origin: bottom center;
    }

    .tree-trunk {
        position: absolute;
        bottom: 0;
        left: 86px;
        width: 45px;
        height: 125px;
        background: linear-gradient(90deg, #4b260f 0 20%, #8a4b20 20% 55%, #5a2e13 55% 100%);
        border: 5px solid #241207;
        box-shadow: 7px 7px 0 rgba(0,0,0,.35);
    }

    .tree-leaf {
        position: absolute;
        background:
            linear-gradient(135deg, #57c42d 0 25%, #3fa51f 25% 50%, #5bd331 50% 75%, #348c18 75%);
        border: 5px solid #1f5f10;
        box-shadow: 7px 7px 0 rgba(0,0,0,.3);
    }

    .leaf1 { width: 125px; height: 82px; left: 42px; top: 50px; }
    .leaf2 { width: 92px; height: 72px; left: 70px; top: 0; }
    .leaf3 { width: 105px; height: 75px; left: 7px; top: 105px; }
    .leaf4 { width: 105px; height: 75px; left: 105px; top: 105px; }
    .leaf5 { width: 125px; height: 70px; left: 42px; top: 115px; }

    .tree-left-big { left: 2%; }
    .tree-left-small { left: 18%; bottom: 18px; }
    .tree-mid-small { left: 38%; bottom: 5px; }
    .tree-mid-medium { right: 38%; bottom: 18px; }
    .tree-right-big { right: 5%; }
    .tree-right-medium { right: 20%; bottom: 0; }

    /* GROUND */
    .pixel-ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 105px;
        background:
            linear-gradient(to bottom, #54d337 0 22%, #287414 22% 29%, #74421d 29% 100%);
        border-top: 5px solid #1e6b12;
        z-index: 4;
    }

    .pixel-ground::before {
        content: "";
        position: absolute;
        inset: 28px 0 0 0;
        background:
            radial-gradient(circle at 8% 35%, #a96a35 0 5px, transparent 6px),
            radial-gradient(circle at 20% 70%, #4b260f 0 5px, transparent 6px),
            radial-gradient(circle at 32% 45%, #a96a35 0 5px, transparent 6px),
            radial-gradient(circle at 50% 75%, #4b260f 0 5px, transparent 6px),
            radial-gradient(circle at 68% 45%, #a96a35 0 5px, transparent 6px),
            radial-gradient(circle at 85% 65%, #4b260f 0 5px, transparent 6px);
        background-size: 130px 70px;
        opacity: .7;
    }


    @keyframes floatDecor {
        0%, 100% { translate: 0 0; }
        50% { translate: 0 -16px; }
    }

    @keyframes cloudMove {
        from { transform: translateX(-14px); }
        to { transform: translateX(22px); }
    }

    @keyframes popDown {
        from { opacity: 0; transform: translateY(-40px) scale(.9); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(25px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 992px) {
        .pixel-title { font-size: 3.8rem; }
        .hero-subtitle { font-size: 1.8rem; }
        .hero-desc { font-size: 1.15rem; }
        .forest { opacity: .85; }
    }

    @media (max-width: 768px) {
        .minecraft-hero { padding: 0 20px; }

        .pixel-title {
            font-size: 2.6rem;
            letter-spacing: 3px;
        }

        .hero-subtitle { font-size: 1.3rem; }
        .hero-desc { font-size: 1rem; }

        .cloud3, .cloud5, .cloud6,
        .tree-left-small,
        .tree-mid-small,
        .tree-mid-medium {
            display: none;
        }

        .forest {
            height: 190px;
            bottom: 70px;
        }

        .tree-left-big {
            left: -25%;
            transform: scale(.7);
        }

        .tree-right-big {
            right: -20%;
            transform: scale(.7);
        }
    }
</style>

<div class="minecraft-hero">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
    <div class="cloud cloud5"></div>
    <div class="cloud cloud6"></div>

    <div class="forest">
        <div class="tree big tree-left-big">
            <div class="tree-trunk"></div>
            <div class="tree-leaf leaf1"></div>
            <div class="tree-leaf leaf2"></div>
            <div class="tree-leaf leaf3"></div>
            <div class="tree-leaf leaf4"></div>
            <div class="tree-leaf leaf5"></div>
        </div>

        <div class="tree small tree-left-small">
            <div class="tree-trunk"></div>
            <div class="tree-leaf leaf1"></div>
            <div class="tree-leaf leaf2"></div>
            <div class="tree-leaf leaf3"></div>
            <div class="tree-leaf leaf4"></div>
            <div class="tree-leaf leaf5"></div>
        </div>

        <div class="tree small tree-mid-small">
            <div class="tree-trunk"></div>
            <div class="tree-leaf leaf1"></div>
            <div class="tree-leaf leaf2"></div>
            <div class="tree-leaf leaf3"></div>
            <div class="tree-leaf leaf4"></div>
            <div class="tree-leaf leaf5"></div>
        </div>

        <div class="tree medium tree-mid-medium">
            <div class="tree-trunk"></div>
            <div class="tree-leaf leaf1"></div>
            <div class="tree-leaf leaf2"></div>
            <div class="tree-leaf leaf3"></div>
            <div class="tree-leaf leaf4"></div>
            <div class="tree-leaf leaf5"></div>
        </div>

        <div class="tree medium tree-right-medium">
            <div class="tree-trunk"></div>
            <div class="tree-leaf leaf1"></div>
            <div class="tree-leaf leaf2"></div>
            <div class="tree-leaf leaf3"></div>
            <div class="tree-leaf leaf4"></div>
            <div class="tree-leaf leaf5"></div>
        </div>

        <div class="tree big tree-right-big">
            <div class="tree-trunk"></div>
            <div class="tree-leaf leaf1"></div>
            <div class="tree-leaf leaf2"></div>
            <div class="tree-leaf leaf3"></div>
            <div class="tree-leaf leaf4"></div>
            <div class="tree-leaf leaf5"></div>
        </div>
    </div>

    <div class="hero-content">
        <h1 class="pixel-title">NASHA TOWN</h1>

        <h2 class="hero-subtitle">Welcome To Nasha Town!</h2>

        <p class="hero-desc">
            Selamat datang di portal laporan warga Nasha Town.
            Laporkan masalah kota, pantau status, dan bantu kota
            jadi lebih baik.
        </p>

        <a href="/reports/" class="pixel-btn">
            LIHAT REPORTS
        </a>
    </div>

    <div class="pixel-ground"></div>

</div>

{% endblock %}
