{% extends 'base.html' %}

{% block title %}Home | Nasha Town{% endblock %}

{% block content %}

<style>
    .container.mt-4{
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    .minecraft-hero {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        padding: 0 40px;
        background:
            linear-gradient(rgba(0,0,0,0.08), rgba(0,0,0,0.34)),
            linear-gradient(135deg, #ff3b3b 0%, #f65858 42%, #bd1818 100%);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .minecraft-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            linear-gradient(90deg, rgba(255,255,255,.05) 25%, transparent 25%) 0 0 / 90px 90px,
            linear-gradient(rgba(255,255,255,.035) 25%, transparent 25%) 0 0 / 90px 90px;
        opacity: .5;
        z-index: 0;
    }

    .hero-content {
        position: relative;
        z-index: 5;
    }

    .pixel-title {
        font-family: 'Cinzel', serif;
        font-size: 5.5rem;
        font-weight: 900;
        color: white;
        text-shadow: 7px 7px 0 #111, 0 0 24px rgba(255,255,255,0.35);
        letter-spacing: 6px;
        animation: popDown .9s ease;
        margin-bottom: 25px;
    }

    .hero-subtitle {
        font-family: monospace;
        font-size: 2.3rem;
        color: white;
        text-shadow: 3px 3px 0 #111;
        margin-bottom: 20px;
        animation: fadeIn 1.2s ease;
    }

    .hero-desc {
        max-width: 900px;
        margin: 0 auto;
        color: #f5f5f5;
        font-size: 1.4rem;
        line-height: 1.9;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.45);
        animation: fadeIn 1.4s ease;
        padding: 0 20px;
    }

    .pixel-btn {
        margin-top: 40px;
        background: linear-gradient(to bottom, #49d12f, #2e9b1e);
        color: white;
        border: 4px solid #174d10;
        padding: 18px 42px;
        font-weight: bold;
        text-decoration: none;
        display: inline-block;
        box-shadow: 6px 6px 0 #111;
        transition: .2s;
        font-size: 1.25rem;
        animation: fadeIn 1.6s ease;
    }

    .pixel-btn:hover {
        transform: translateY(-4px);
        box-shadow: 9px 9px 0 #111;
        color: white;
    }

    .decor {
        position: absolute;
        z-index: 3;
        image-rendering: pixelated;
        animation: floatDecor 4s ease-in-out infinite;
    }

    .grass-block {
        width: 130px;
        height: 130px;
        background:
            linear-gradient(to bottom, #61d83e 0 22%, #3e9b23 22% 30%, #8a5528 30% 100%);
        border: 6px solid #241308;
        box-shadow: 9px 9px 0 rgba(0,0,0,.42);
    }

    .grass-block::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 18% 45%, #b0753d 0 4px, transparent 5px),
            radial-gradient(circle at 40% 60%, #5a3217 0 4px, transparent 5px),
            radial-gradient(circle at 70% 48%, #b0753d 0 4px, transparent 5px),
            radial-gradient(circle at 80% 75%, #5a3217 0 4px, transparent 5px),
            radial-gradient(circle at 25% 82%, #b0753d 0 4px, transparent 5px);
    }

    .stone-block {
        width: 85px;
        height: 85px;
        background:
            linear-gradient(135deg, #9a9a9a 0 25%, #6f6f6f 25% 50%, #858585 50% 75%, #555 75%);
        border: 5px solid #242424;
        box-shadow: 7px 7px 0 rgba(0,0,0,.4);
    }

    .chest {
        width: 140px;
        height: 95px;
        background:
            linear-gradient(to bottom, #d88925 0 45%, #8b4d1b 45% 100%);
        border: 6px solid #2d1a0c;
        box-shadow: 8px 8px 0 rgba(0,0,0,.42);
    }

    .chest::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 6px;
        background: #3a2413;
        top: 43%;
        left: 0;
    }

    .chest::after {
        content: "";
        position: absolute;
        width: 22px;
        height: 28px;
        background: #d8d8d8;
        border: 3px solid #555;
        left: 50%;
        top: 44%;
        transform: translate(-50%, -50%);
    }

    .cloud {
        width: 150px;
        height: 55px;
        background: white;
        box-shadow: 7px 7px 0 rgba(0,0,0,.2);
        clip-path: polygon(0 55%, 16% 55%, 16% 35%, 32% 35%, 32% 20%, 55% 20%, 55% 35%, 78% 35%, 78% 55%, 100% 55%, 100% 85%, 0 85%);
    }

    .torch {
        width: 24px;
        height: 125px;
        background: linear-gradient(to right, #5a3417, #c17a2b, #5a3417);
        border: 4px solid #2b1408;
        box-shadow: 7px 7px 0 rgba(0,0,0,.4);
    }

    .torch::before {
        content: "";
        position: absolute;
        width: 44px;
        height: 48px;
        background: linear-gradient(135deg, #fff176 0 20%, #ffb300 20% 55%, #ff5722 55% 100%);
        border: 4px solid #8b1a00;
        top: -38px;
        left: -14px;
        clip-path: polygon(50% 0, 80% 35%, 70% 100%, 30% 100%, 20% 35%);
    }

    .flower {
        width: 28px;
        height: 95px;
        background: #2f9d2f;
        border: 4px solid #145214;
    }

    .flower::before {
        content: "";
        position: absolute;
        width: 72px;
        height: 72px;
        background: #e51b23;
        border: 4px solid #7a0b0f;
        top: -58px;
        left: -25px;
        clip-path: polygon(50% 0, 62% 32%, 100% 32%, 70% 55%, 82% 92%, 50% 72%, 18% 92%, 30% 55%, 0 32%, 38% 32%);
    }

    .grass1 { top: 4%; left: -35px; transform: rotate(-16deg); }
    .grass2 { top: 8%; right: 55px; transform: rotate(13deg); animation-delay: .5s; }
    .grass3 { bottom: -10px; right: -25px; transform: rotate(-8deg); animation-delay: 1s; }

    .stone1 { top: 53%; left: 75px; transform: rotate(-10deg); animation-delay: .8s; }
    .cloud1 { top: 14%; right: 330px; animation-delay: .3s; }
    .torch1 { top: 52%; right: 155px; transform: rotate(18deg); animation-delay: 1.1s; }
    .flower1 { top: 31%; left: 190px; transform: rotate(18deg); animation-delay: .6s; }
    .chest1 { bottom: 45px; right: 175px; animation-delay: .9s; }

    .tree {
        position: absolute;
        bottom: 30px;
        left: 45px;
        width: 230px;
        height: 260px;
        z-index: 3;
        image-rendering: pixelated;
    }

    .tree-trunk {
        position: absolute;
        bottom: 0;
        left: 95px;
        width: 48px;
        height: 130px;
        background:
            linear-gradient(90deg, #5a2e13 0 25%, #9b5a28 25% 55%, #6b3a18 55% 100%);
        border: 5px solid #2f1a0e;
        box-shadow: 7px 7px 0 rgba(0,0,0,.35);
    }

    .tree-leaf {
        position: absolute;
        background:
            linear-gradient(135deg, #57c42d 0 25%, #3fa51f 25% 50%, #5bd331 50% 75%, #348c18 75%);
        border: 5px solid #1f5f10;
        box-shadow: 7px 7px 0 rgba(0,0,0,.3);
    }

    .leaf1 { width: 120px; height: 85px; left: 55px; top: 25px; }
    .leaf2 { width: 95px; height: 75px; left: 88px; top: -25px; }
    .leaf3 { width: 105px; height: 80px; left: 20px; top: 92px; }
    .leaf4 { width: 110px; height: 80px; left: 115px; top: 92px; }
    .leaf5 { width: 115px; height: 70px; left: 60px; top: 102px; }

    .pixel-ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 70px;
        background:
            linear-gradient(to bottom, #50c832 0 24%, #235f14 24% 30%, #74421d 30% 100%);
        border-top: 5px solid #1e6b12;
        z-index: 2;
    }

    @keyframes floatDecor {
        0%, 100% { translate: 0 0; }
        50% { translate: 0 -18px; }
    }

    @keyframes popDown {
        from { opacity: 0; transform: translateY(-40px) scale(.9); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(25px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 992px) {
        .pixel-title { font-size: 3.8rem; }
        .hero-subtitle { font-size: 1.8rem; }
        .hero-desc { font-size: 1.15rem; }
        .tree { opacity: .85; transform: scale(.75); transform-origin: bottom left; }
        .chest1 { right: 40px; }
        .cloud1 { right: 120px; }
    }

    @media (max-width: 768px) {
        .minecraft-hero { padding: 0 20px; }

        .pixel-title {
            font-size: 2.6rem;
            letter-spacing: 3px;
        }

        .hero-subtitle { font-size: 1.3rem; }
        .hero-desc { font-size: 1rem; }

        .grass-block { width: 70px; height: 70px; }
        .stone-block { width: 55px; height: 55px; }

        .cloud, .torch, .flower, .chest, .tree {
            display: none;
        }
    }
</style>

<div class="minecraft-hero">

    <div class="decor grass-block grass1"></div>
    <div class="decor grass-block grass2"></div>
    <div class="decor grass-block grass3"></div>

    <div class="decor stone-block stone1"></div>
    <div class="decor cloud cloud1"></div>
    <div class="decor torch torch1"></div>
    <div class="decor flower flower1"></div>
    <div class="decor chest chest1"></div>

    <div class="tree">
        <div class="tree-trunk"></div>
        <div class="tree-leaf leaf1"></div>
        <div class="tree-leaf leaf2"></div>
        <div class="tree-leaf leaf3"></div>
        <div class="tree-leaf leaf4"></div>
        <div class="tree-leaf leaf5"></div>
    </div>

    <div class="hero-content">
        <h1 class="pixel-title">NASHA TOWN</h1>

        <h2 class="hero-subtitle">Welcome To Nasha Town!</h2>

        <p class="hero-desc">
            Selamat datang di portal laporan warga Nasha Town.
            Laporkan masalah kota, pantau status, dan bantu kota
            jadi lebih baik.
        </p>

        <a href="/reports/" class="pixel-btn">
            LIHAT REPORTS
        </a>
    </div>

    <div class="pixel-ground"></div>

</div>

{% endblock %}
