{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<style>
    body{
        background:
            linear-gradient(rgba(5,10,25,0.68), rgba(5,10,25,0.84)),
            url('https://c.tenor.com/lPsMNpUunr4AAAAd/minecraft-aesthetic-background.gif')
            center center / cover no-repeat fixed !important;
    }

    .login-wrap{
        min-height: 78vh;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: pixelUp .7s ease;
    }

    .login-card{
        width: 100%;
        max-width: 430px;
        background: rgba(18,18,18,0.92);
        border: 5px solid #111;
        border-radius: 0;
        box-shadow: 10px 10px 0 #000;
        padding: 28px;
    }

    .login-title{
        font-family: 'Cinzel', serif;
        font-size: 2.2rem;
        font-weight: 900;
        text-transform: uppercase;
        color: white;
        text-align: center;
        text-shadow: 4px 4px 0 #000;
        margin-bottom: 25px;
    }

    .login-card label{
        font-weight: 900;
        text-transform: uppercase;
        color: white;
        text-shadow: 2px 2px 0 #000;
        margin-bottom: 8px;
    }

    .login-card input{
        background: #252525 !important;
        color: white !important;
        border: 4px solid #111 !important;
        border-radius: 0 !important;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05);
        font-weight: 700;
        padding: 12px;
    }

    .login-card input:focus{
        outline: none !important;
        border-color: #78ff5c !important;
        box-shadow:
            inset 0 0 0 2px rgba(255,255,255,0.08),
            0 0 18px rgba(120,255,92,0.25) !important;
    }

    .pixel-login-btn{
        width: 100%;
        background: #2f9cff !important;
        color: white !important;
        border: 4px solid #111 !important;
        border-radius: 0 !important;
        box-shadow: 5px 5px 0 #000;
        font-weight: 900;
        text-transform: uppercase;
        padding: 12px;
        transition: .2s ease;
    }

    .pixel-login-btn:hover{
        background: #78ff5c !important;
        color: #111 !important;
        transform: translateY(-4px);
        box-shadow: 8px 8px 0 #000;
    }

    .pixel-alert{
        background: rgba(255,23,68,0.9) !important;
        border: 4px solid #111 !important;
        border-radius: 0 !important;
        box-shadow: 5px 5px 0 #000;
        color: white !important;
        font-weight: 800;
    }

    .register-link{
        margin-top: 18px;
        text-align: center;
        font-weight: 700;
    }

    .register-link a{
        color: #78ff5c;
        text-decoration: none;
        font-weight: 900;
    }

    @keyframes pixelUp{
        from{
            opacity: 0;
            transform: translateY(35px);
        }

        to{
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="login-wrap">

    <div class="login-card">

        <h3 class="login-title">
            Login
        </h3>

        {% if messages %}
            {% for message in messages %}
                <div class="alert pixel-alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label">
                    Username
                </label>

                <input type="text"
                       name="username"
                       class="form-control"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       required>
            </div>

            <button type="submit"
                    class="btn pixel-login-btn">
                Login
            </button>
        </form>

        <div class="register-link">
            Belum punya akun?
            <a href="{% url 'register' %}">
                Register
            </a>
        </div>

    </div>

</div>

{% endblock %}
